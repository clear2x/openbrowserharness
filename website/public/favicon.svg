<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="OpenBrowserHarness">
  <!--
    OpenBrowserHarness mark: the fat harness whale, pixel-traced from the
    reference logo (sigma-13 mask + strongest curve fitting: the smoothest
    pass that still holds the twin flukes). Craft layers: three-stop body
    gradient, back sheen, a thick blurred drop shadow and a deep grounding
    pool, and a three-drop spout arc floating clear of the blowhole.
    Regenerate the committed PNGs and the website favicon after editing
    with the extension package's generate:icons script.
  -->
  <defs>
    <linearGradient id="tile" x1="4" y1="4" x2="124" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F7FF"/>
      <stop offset="0.55" stop-color="#DCE8FF"/>
      <stop offset="1" stop-color="#C2D7FF"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="22" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B78FF"/>
      <stop offset="0.55" stop-color="#3D5DFB"/>
      <stop offset="1" stop-color="#2847D6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1B2C8F" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1B2C8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <ellipse cx="64.00" cy="96.33" rx="43.20" ry="9" fill="url(#shadow)"/>
