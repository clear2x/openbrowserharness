# Lean docs-site deploy for the OpenBrowserHarness fork: verify the doc
# corpus, build the VitePress site, and publish it to GitHub Pages. Adapted
# from the archived upstream docs-pages.yml (see workflows.upstream/) —
# hosted runners only.
#
# Gated by the repository variable DOCS_PAGES_ENABLED: Pages needs a plan
# that supports it (public repos work on the free plan). Flip it on with
#   gh variable set DOCS_PAGES_ENABLED --repo <owner>/<repo> --body true
# and every subsequent run builds and deploys; until then runs skip green.
name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - 'README.zh.md'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - 'README.md'
      - 'README.zh.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ vars.DOCS_PAGES_ENABLED == 'true' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Verify and build documentation
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        # Site build only (VitePress build + fragment check). The full
        # doc-sync gate additionally runs translation pairing and type
        # equivalence over bilingual docs that are still converging after
        # the 0.1.5 sync; that full gate belongs to release readiness,
        # not to every docs deploy.
        run: pnpm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/.dist

  deploy:
    needs: [gate, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
