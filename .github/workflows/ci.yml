# Lean CI for the OpenBrowserHarness fork.
#
# The upstream deepseek-harness CI (archived under .github/workflows.upstream/)
# targets enterprise/self-hosted runner pools this project does not have. This
# workflow covers the surfaces this fork actually ships on plain hosted
# runners: workspace lib build -> extension bundle -> extension test suite ->
# repo hygiene gates that need no credentials.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  extension:
    name: build + test (extension)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The extension bundles workspace-built libs; vite fails loudly listing
      # every missing artifact if this step is skipped (see vite.config.ts).
      # The 0.1.5 package set needs a larger heap than the hosted-runner default.
      - name: Build workspace libs
        run: pnpm run build:lib
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build extension
        run: pnpm run build:extension

      # Extension suites must run from the repository root (roster cases
      # anchor on cwd; running inside apps/extension mis-resolves them).
      - name: Test
        run: pnpm exec vitest run apps/extension/tests

      - name: Typecheck
        run: pnpm run typecheck

  browser-packages:
    name: test (browser capability packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm exec vitest run packages/browser packages/fs/fs-opfs packages/session/session-persistence-indexeddb packages/fs/tool-fs packages/subagent/subagent-spawn-in-process

  # Root-manifest dependency bumps (chokidar et al.) reach these harness
  # consumer packages without touching the extension — give them their own
  # CI lane so a bump that breaks them is caught before merge.
  harness-consumers:
    name: test (harness consumer packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # session-telemetry-otel transitively requires the native flock/system
      # addon (0.1.5 spill policy); build the host addon for this runner.
      - name: Build native system addon
        run: pnpm run build:native-system

      # The consumer suite at 0.1.5 scope needs a larger heap than the
      # hosted-runner default.
      - name: Test
        run: pnpm exec vitest run packages/settings packages/credentials packages/skill/skill-filesystem packages/session/session-telemetry-otel
        env:
          NODE_OPTIONS: --max-old-space-size=4096
