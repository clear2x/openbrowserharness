<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="OpenBrowserHarness" shape-rendering="geometricPrecision">
  <!--
    OpenBrowserHarness mark: an open orbit and a page-driving pointer.
    The ring is the O in OpenBrowserHarness; the pointer occupies its break,
    so the two shapes read as one gesture even at the 16px toolbar size.
    Regenerate the committed PNGs and the website favicon after editing
    with the extension package's generate:icons script.
  -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#172554"/>
  <path d="M78.23 32.03 A35 35 0 1 0 95.97 49.77"
        fill="none" stroke="#67E8F9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 28 L97 51 L88 59 L80 52 L74 61 L69 57 L76 46 L77 31 Z" fill="#F8FAFC"/>
</svg>
