<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenBrowserHarness</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0d0d10; color: #e8e8ea;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    main { text-align: center; max-width: 30rem; padding: 2rem; }
    h1 { font-size: 1.15rem; font-weight: 600; }
    p { font-size: 0.9rem; color: #9a9aa2; line-height: 1.6; }
    .ok { color: #4ade80; } .err { color: #f87171; }
  </style>
</head>
<body>
  <!-- oauth-relay.js rewrites the title, lang and both lines in the browser's
       language on load; these stay only if the script never runs. -->
  <main>
    <h1 id="status">OpenBrowserHarness</h1>
    <p id="detail">Completing sign-in… / 正在完成登录…</p>
  </main>
  <script type="module" src="oauth-relay.js"></script>
</body>
</html>
